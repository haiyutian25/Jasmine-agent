[package]
name = "jasmine-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jasmine-utils-string = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uniffi = { workspace = true, optional = true }

[features]
# 跨语言边界用：只有平台侧构建（ffi）才打开，命令行与测试默认不带。
uniffi = ["dep:uniffi"]

[lints]
workspace = true

[lib]
doctest = false
