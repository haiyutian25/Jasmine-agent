[package]
name = "jasmine-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jasmine-api = { workspace = true }
jasmine-client = { workspace = true }
jasmine-protocol = { workspace = true }
jasmine-http-client = { workspace = true }
jasmine-model-provider = { workspace = true }
jasmine-model-provider-info = { workspace = true }
jasmine-rollout = { workspace = true }
jasmine-tools = { workspace = true }
jasmine-utils-string = { workspace = true }
# 上下文压缩要用它的 approx_token_count / truncate_text（与 tools/src/response_history.rs 同一套口径）。
jasmine-utils-output-truncation = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# 会话服务持有一个**共用**的 runtime（见 session/service.rs 的 tokio_runtime）：`rt-multi-thread`
# 是必需的 —— current_thread 的 runtime 在多条会话各自从自己的线程 block_on 时会互相打架。
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
# 压缩的测试要造一段假的 SSE 字节流（假 transport 的响应体），所以需要一个 Bytes 构造器。
# `jasmine-client` 把 http-client 的类型都转出来了，但 `bytes::Bytes` 不在其中。
bytes = { workspace = true }
# 假 transport 要回一个 HTTP 状态码（`StreamResponse.status`），同样不在转出来的集合里。
http = { workspace = true }

[lints]
workspace = true

[lib]
doctest = false
