# jasmine Rust workspace.

#

# Layout and dependency versions mirror the upstream codex workspace: every crate

# declares versions through `workspace = true` so a single edit moves the whole tree,

# and the clippy policy lives here so all crates inherit the same rules.

[workspace]

resolver = "2"

members = [
    "api",
    "client",
    "core",
    "ffi",
    "http-client",
    "model-provider",
    "model-provider-info",
    "protocol",
    "rollout",
    "tools",
    "utils/string",
    "utils/output-truncation",
]


[workspace.package]

version = "0.0.0"

# Track the edition for all workspace crates in one place. Individual

# crates can still override this value, but keeping it here means new

# crates created with `cargo new -w ...` automatically inherit the 2024

# edition.

edition = "2024"

license = "Apache-2.0"



[workspace.dependencies]
jasmine-api = { path = "api" }
jasmine-client = { path = "client" }
jasmine-core = { path = "core" }
jasmine-http-client = { path = "http-client" }
jasmine-model-provider = { path = "model-provider" }
jasmine-model-provider-info = { path = "model-provider-info" }
jasmine-protocol = { path = "protocol" }
jasmine-rollout = { path = "rollout" }
jasmine-tools = { path = "tools" }
jasmine-utils-output-truncation = { path = "utils/output-truncation" }
jasmine-utils-string = { path = "utils/string" }
bitflags = "2.13.1"
bytes = "1.10.1"
chrono = "0.4.43"
eventsource-stream = "0.2.3"
futures = { version = "0.3", default-features = false }
http = "1.3.1"
httpdate = "1.0.3"
jsonptr = { version = "0.7.1", default-features = false }
pretty_assertions = "1.4.1"
rand = "0.9"
regex-lite = "0.1.8"
reqwest = { version = "0.12", default-features = false, features = [
    "charset",
    "cookies",
    "http2",
    "rustls-tls",
    "rustls-tls-native-roots",
] }
serde = { version = "1", features = ["rc"] }
serde_json = "1"
thiserror = "2.0.17"
tokio = "1"
tokio-util = "0.7.18"
tracing = "0.1.44"
uniffi = "0.32.2"
urlencoding = "2.1"
uuid = "1"
[workspace.lints]

rust = {}



[workspace.lints.clippy]

# 传输错误枚举沿用参照实现的形状：`Http` 变体带 status / headers / body / retry-after，
# 所以 `Result<_, TransportError>` 本身就是个大值。装箱会改掉那个形状。
result_large_err = "allow"

await_holding_invalid_type = "deny"

await_holding_lock = "deny"

disallowed_methods = "deny"

expect_used = "deny"

identity_op = "deny"

manual_clamp = "deny"

manual_filter = "deny"

manual_find = "deny"

manual_flatten = "deny"

manual_map = "deny"

manual_memcpy = "deny"

manual_non_exhaustive = "deny"

manual_ok_or = "deny"

manual_range_contains = "deny"

manual_retain = "deny"

manual_strip = "deny"

manual_try_fold = "deny"

manual_unwrap_or = "deny"

needless_borrow = "deny"

needless_borrowed_reference = "deny"

needless_collect = "deny"

needless_late_init = "deny"

needless_option_as_deref = "deny"

needless_question_mark = "deny"

needless_update = "deny"

redundant_clone = "deny"

redundant_closure = "deny"

redundant_closure_for_method_calls = "deny"

redundant_static_lifetimes = "deny"

trivially_copy_pass_by_ref = "deny"

uninlined_format_args = "deny"

unnecessary_filter_map = "deny"

unnecessary_lazy_evaluations = "deny"

unnecessary_sort_by = "deny"

unnecessary_to_owned = "deny"

unwrap_used = "deny"



# cargo-shear cannot see the platform-specific openssl-sys usage, so we

# silence the false positive here instead of deleting a real dependency.





























